spring:
  application:
    name: visionai

  datasource:
    url: jdbc:postgresql://localhost:5555/visionai
    username: visionai
    password: visionai

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

# Custom properties
vision:
  codeproject-ai:
    url: http://localhost:32168
  reolink:
    default-host: ""
    default-user: ""
    default-password: ""

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true

logging:
  level:
    dev.giro.vision: DEBUG

---
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:postgresql://postgres:5432/visionai

vision:
  codeproject-ai:
    url: http://codeproject-ai:32168

---
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:tc:postgresql:16-alpine:///visionai
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
